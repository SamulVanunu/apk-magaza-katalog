name: Katalog otomasyonu

on:
  push:
    branches:
      - main
    paths:
      - 'inbox/**.apk'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isle:
    name: APK inbox isle
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu cek
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari kur
        run: python -m pip install --upgrade pip && pip install pyaxmlparser cryptography

      - name: APK'lari isle ve katalogu guncelle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: python tools/process_inbox.py
