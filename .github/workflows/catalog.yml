name: Katalog otomasyonu

on:
  push:
    branches:
      - main
    paths:
      - 'inbox/**.apk'
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  isle:
    name: APK inbox isle
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu cek
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Bagimliliklari kur
        run: python -m pip install --upgrade pip && pip install pyaxmlparser cryptography

      - name: Release asset'lerini inbox'a indir
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          mkdir -p inbox
          TAG="$RELEASE_TAG"
          if [ -z "$TAG" ]; then TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName); fi
          BODY="$RELEASE_BODY"
          if [ -z "$BODY" ]; then BODY=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body); fi
          export RELEASE_BODY="$BODY"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir inbox --pattern '*.apk'
          python - <<'PY'
          import json, os
          from pathlib import Path
          try:
              meta = json.loads(os.environ.get("RELEASE_BODY", "") or "{}")
          except Exception:
              meta = {}
          keys = ("name", "category", "shortDescription", "description", "notes",
                  "screenshots", "tvSupported", "tvOnly")
          keep = {k: meta[k] for k in keys if k in meta}
          if keep:
              for apk in Path("inbox").glob("*.apk"):
                  apk.with_suffix(".json").write_text(
                      json.dumps(keep, ensure_ascii=False, indent=2), encoding="utf-8")
          PY

      - name: APK'lari isle ve katalogu guncelle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: main
        run: python tools/process_inbox.py
